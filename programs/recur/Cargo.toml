[package]
name = "recur"
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "recur"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = "1.2.1"
subscriptions = "=0.5.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "0.18.1"
litesvm-token = "0.18.1"
sha2 = "0.10"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-program-pack = "3.1"
solana-pubkey = "3"
solana-sdk-ids = "3"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-error = "3"
